<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ÆVOLUTION Nexus Hub</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #03030a;
      color: #00f5ff;
      font-family: 'Share Tech Mono', monospace;
      padding: 40px 20px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Scanline overlay */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 245, 255, 0.015) 2px, rgba(0, 245, 255, 0.015) 4px);
      pointer-events: none;
      z-index: 999;
    }

    header { text-align: center; margin-bottom: 40px; }
    
    h1 {
      font-family: 'Orbitron', monospace;
      font-size: 2.5rem;
      font-weight: 900;
      text-shadow: 0 0 20px #00f5ff;
      color: #00f5ff;
      margin-bottom: 15px;
      text-transform: uppercase;
    }

    #searchBar {
      width: 100%;
      max-width: 600px;
      background: rgba(0, 245, 255, 0.05);
      color: #ff00c8;
      border: 1px solid #00f5ff;
      padding: 15px 20px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.1rem;
      outline: none;
      transition: all 0.3s;
      box-shadow: inset 0 0 10px rgba(0,245,255,0.1);
    }

    #searchBar:focus {
      box-shadow: 0 0 20px rgba(0,245,255,0.3), inset 0 0 15px rgba(0,245,255,0.2);
    }

    /* The Cloud Grid */
    #cloudGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: rgba(0, 245, 255, 0.03);
      border: 1px solid rgba(0, 245, 255, 0.2);
      border-left: 3px solid #ff00c8;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .card:hover {
      background: rgba(255, 0, 200, 0.1);
      border-color: #ff00c8;
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(255,0,200,0.3);
    }

    .card-title {
      font-family: 'Orbitron', monospace;
      font-size: 1.2rem;
      color: #00f5ff;
      margin-bottom: 10px;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .tag {
      background: rgba(255,0,200,0.1);
      border: 1px solid rgba(255,0,200,0.3);
      color: #ff00c8;
      font-size: 0.7rem;
      padding: 3px 8px;
    }

    /* Modal Popup */
    #modalOverlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(3, 3, 10, 0.9);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    #modalContent {
      background: #03030a;
      border: 1px solid #ff00c8;
      box-shadow: 0 0 30px rgba(255,0,200,0.2);
      max-width: 800px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 30px;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 15px; right: 20px;
      color: #00f5ff;
      font-size: 1.5rem;
      cursor: pointer;
      font-family: 'Orbitron', monospace;
    }

    .close-btn:hover { color: #ff00c8; text-shadow: 0 0 10px #ff00c8; }

    #modalImage {
      width: 100%;
      height: 250px;
      object-fit: cover;
      margin-bottom: 20px;
      border: 1px solid rgba(0,245,255,0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      background: #050505;
      color: rgba(0,245,255,0.2);
      font-family: 'Orbitron', monospace;
      font-size: 5rem;
      text-shadow: 0 0 20px rgba(0,245,255,0.1);
    }

    #modalHeader { font-family: 'Orbitron', monospace; color: #00f5ff; font-size: 2rem; margin-bottom: 5px; }
    #modalSub { color: #ff00c8; font-size: 0.9rem; margin-bottom: 20px; border-bottom: 1px solid rgba(0,245,255,0.1); padding-bottom: 10px; }
    
    .md-body { line-height: 1.6; color: rgba(0,245,255,0.85); font-size: 0.9rem; }
    .md-body h1, .md-body h2, .md-body h3 { font-family: 'Orbitron', monospace; color: #00f5ff; margin: 15px 0 10px; }
    .md-body p { margin-bottom: 15px; }
    .md-body strong { color: #ff00c8; }
    
    #modalFooter {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,0,200,0.2);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .footer-tag {
      background: transparent;
      border: 1px solid #00f5ff;
      color: #00f5ff;
      padding: 5px 12px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .footer-tag:hover { background: #00f5ff; color: #03030a; box-shadow: 0 0 10px #00f5ff; }

  </style>
</head>
<body>

  <header>
    <h1>The Dark Synthesis Hub</h1>
    <input type="text" id="searchBar" placeholder="Search parameters, tags, or concepts...">
  </header>

  <div id="cloudGrid"></div>

  <!-- Popup Modal -->
  <div id="modalOverlay" onclick="closeModal(event)">
    <div id="modalContent" onclick="event.stopPropagation()">
      <span class="close-btn" onclick="closeModal(event)">X</span>
      <div id="modalImage">Æ</div>
      <h2 id="modalHeader">Title</h2>
      <div id="modalSub">Subtitle / Link</div>
      <div class="md-body" id="modalMarkdown">Loading...</div>
      <div id="modalFooter"></div>
    </div>
  </div>

  <script>
    let database = [];

    // 1. Load the Nexus-Index JSON
    async function init() {
      try {
        const response = await fetch('nexus-index.json');
        database = await response.json();
        renderGrid(database);
      } catch (err) {
        console.error("Failed to load nexus-index.json", err);
        document.getElementById('cloudGrid').innerHTML = "<p>Error: Could not load nexus-index.json. Ensure you are running a local server.</p>";
      }
    }

    // 2. Render the Cloud Grid
    function renderGrid(data) {
      const grid = document.getElementById('cloudGrid');
      grid.innerHTML = '';
      data.forEach(item => {
        const tagsHtml = item.tags.map(t => `<span class="tag">${t}</span>`).join('');
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<div class="card-title">${item.title}</div><div class="card-tags">${tagsHtml}</div>`;
        card.onclick = () => openModal(item);
        grid.appendChild(card);
      });
    }

    // 3. Open Modal and Fetch Markdown
    async function openModal(item) {
      document.getElementById('modalHeader').textContent = item.title;
      
      const sub = document.getElementById('modalSub');
      if(item.link) {
        sub.innerHTML = `<a href="${item.link}" target="_blank" style="color:#ff00c8; text-decoration:none;">${item.link}</a>`;
      } else {
        sub.textContent = "Classified Entry";
      }

      const imgDiv = document.getElementById('modalImage');
      if (item.image) {
        imgDiv.innerHTML = `<img src="${item.image}" style="width:100%; height:100%; object-fit:cover;">`;
      } else {
        imgDiv.innerHTML = "Æ"; // The default placeholder!
      }

      // Fetch the actual markdown file content
      const mdDiv = document.getElementById('modalMarkdown');
      mdDiv.innerHTML = "Processing data stream...";
      document.getElementById('modalOverlay').style.display = 'flex';

      try {
        const fileResponse = await fetch(item.file);
        if (fileResponse.ok) {
          const text = await fileResponse.text();
          mdDiv.innerHTML = marked.parse(text);
        } else {
          mdDiv.innerHTML = "<span style='color:red;'>Error 404: File not found in directory.</span>";
        }
      } catch (e) {
        mdDiv.innerHTML = "<span style='color:red;'>System Error: Cannot read file.</span>";
      }

      // Render clickable footer tags
      const footer = document.getElementById('modalFooter');
      footer.innerHTML = item.tags.map(t => `<div class="footer-tag" onclick="filterByTag('${t}')">${t}</div>`).join('');
    }

    function closeModal(e) {
      document.getElementById('modalOverlay').style.display = 'none';
    }

    function filterByTag(tag) {
      closeModal();
      document.getElementById('searchBar').value = tag;
      filterGrid();
    }

    function filterGrid() {
      const query = document.getElementById('searchBar').value.toLowerCase();
      const filtered = database.filter(item => {
        return item.title.toLowerCase().includes(query) || 
               item.tags.some(t => t.toLowerCase().includes(query));
      });
      renderGrid(filtered);
    }

    document.getElementById('searchBar').addEventListener('input', filterGrid);
    
    // Boot up
    init();
  </script>

</body>
</html>
