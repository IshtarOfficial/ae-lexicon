<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ÆVOVERSE NEXUS</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

    :root {
      --cyan:#00bbc2;--mag:#ff00c8;--purple:#b026ff;--b-accent:#ffb000;
      --bg:#03030a;--bg2:#07070f;--bg3:#050510;
      --border:#1e1e3a;--text:#c0c0d0;--bright:#e0e0f0;--dim:#404060;--dead:#252535;
      --danger:#ff3b5c;--ok:#4ce6a0;
      --cyan-rgb:0,187,194;--mag-rgb:255,0,200;
      --font-size:13px;
    }
    body.light {
      --bg:#f0f0f8;--bg2:#e4e4f0;--bg3:#eaeaf5;--b-accent:#cc8800;
      --border:#c0c0d8;--text:#303050;--bright:#101030;--dim:#9090b0;--dead:#c8c8d8;
      --danger:#d81050;--ok:#0f9e63;
    }
    @keyframes gradshift {
      0%{background-position:0% 50%;}
      50%{background-position:100% 50%;}
      100%{background-position:0% 50%;}
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background:var(--bg); color:var(--text);
      font-family:'Share Tech Mono',monospace; font-size:var(--font-size);
      min-height:100vh; overflow-x:hidden;
      transition:background .25s ease,color .25s ease;
      padding: 40px 20px;
    }
    body::before {
      content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(var(--cyan-rgb), 0.015) 2px, rgba(var(--cyan-rgb), 0.015) 4px);
      pointer-events: none; z-index: 999;
    }

    .head-row { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; max-width: 1200px; margin: 0 auto 20px auto; }
    h1.nexus-title {
      font-family:'Orbitron',monospace; font-weight:900; font-size:2.5rem; letter-spacing:0.12em;
      background:linear-gradient(270deg,var(--cyan),var(--mag),var(--purple),var(--cyan));
      background-size:300% 300%; -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      animation:gradshift 5s ease infinite; margin:0; text-transform: uppercase; text-shadow: 0 0 20px rgba(var(--cyan-rgb), 0.5);
    }
    .icon-btn {
      font-family:'Share Tech Mono',monospace;font-size:15px;color:var(--dim);
      background:var(--bg2);border:1px solid var(--border);border-radius:6px;
      width:34px;height:34px;flex-shrink:0;cursor:pointer;
      display:flex;align-items:center;justify-content:center;transition:all .2s;
    }
    .icon-btn:hover { color:var(--cyan); border-color:var(--cyan); }

    /* Search & Grid */
    #searchBar {
      width: 100%; max-width: 600px; background: rgba(var(--cyan-rgb), 0.05); color: var(--mag);
      border: 1px solid var(--cyan); padding: 15px 20px; font-family: 'Share Tech Mono', monospace;
      font-size: 1.1rem; outline: none; transition: all 0.3s;
      box-shadow: inset 0 0 10px rgba(var(--cyan-rgb),0.1);
      display: block; margin: 0 auto 40px auto; border-radius: 4px;
    }
    #searchBar:focus { box-shadow: 0 0 20px rgba(var(--cyan-rgb),0.3), inset 0 0 15px rgba(var(--cyan-rgb),0.2); }
    #cloudGrid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px;
      max-width: 1200px; margin: 0 auto;
    }
    .card {
      background: rgba(var(--cyan-rgb), 0.03); border: 1px solid rgba(var(--cyan-rgb), 0.2); border-left: 3px solid var(--mag);
      padding: 20px; cursor: pointer; transition: all 0.3s; border-radius: 4px;
    }
    .card:hover {
      background: rgba(var(--mag-rgb), 0.1); border-color: var(--mag); transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(var(--mag-rgb),0.3);
    }
    .card-title { font-family: 'Orbitron', monospace; font-size: 1.2rem; color: var(--cyan); margin-bottom: 10px; }
    .card-tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .tag { background: rgba(var(--mag-rgb),0.1); border: 1px solid rgba(var(--mag-rgb),0.3); color: var(--mag); font-size: 0.7rem; padding: 3px 8px; border-radius: 3px;}

    /* Modal */
    #modalOverlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(3, 3, 10, 0.9); backdrop-filter: blur(5px);
      display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px;
    }
    #modalOverlay.open { display: flex; }
    #modalContent {
      background: var(--bg); border: 1px solid var(--mag); box-shadow: 0 0 30px rgba(var(--mag-rgb),0.2);
      max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 30px; position: relative;
    }
    .close-btn { position: absolute; top: 15px; right: 20px; color: var(--cyan); font-size: 1.5rem; cursor: pointer; font-family: 'Orbitron', monospace; }
    .close-btn:hover { color: var(--mag); text-shadow: 0 0 10px var(--mag); }
    #modalImage {
      width: 100%; height: 250px; object-fit: cover; margin-bottom: 20px; border: 1px solid rgba(var(--cyan-rgb),0.3);
      display: flex; justify-content: center; align-items: center; background: #050505; color: rgba(var(--cyan-rgb),0.2);
      font-family: 'Orbitron', monospace; font-size: 5rem; text-shadow: 0 0 20px rgba(var(--cyan-rgb),0.1); position: relative; overflow: hidden;
    }
    #modalImage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #modalHeader { font-family: 'Orbitron', monospace; color: var(--cyan); font-size: 2rem; margin-bottom: 5px; }
    #modalSub { color: var(--mag); font-size: 0.9rem; margin-bottom: 20px; border-bottom: 1px solid rgba(var(--cyan-rgb),0.1); padding-bottom: 10px; }
    #modalSub a { color: var(--mag); text-decoration: none; }
    #modalSub a:hover { text-shadow: 0 0 8px var(--mag); }

    /* Markdown */
    .md-body { line-height: 1.6; color: rgba(var(--cyan-rgb), 0.85); font-size: 0.9rem; }
    .md-body h1, .md-body h2, .md-body h3, .md-body h4, .md-body h5, .md-body h6 { font-family: 'Orbitron', monospace; color: var(--cyan); margin: 15px 0 10px; text-shadow: 0 0 8px rgba(var(--cyan-rgb),0.4); }
    .md-body h1 { font-size: 1.6rem; } .md-body h2 { font-size: 1.3rem; } .md-body h3 { font-size: 1.1rem; }
    .md-body p { margin-bottom: 15px; }
    .md-body strong { color: var(--mag); text-shadow: 0 0 6px rgba(var(--mag-rgb),0.3); }
    .md-body em { color: rgba(var(--mag-rgb), 0.8); font-style: italic; }
    .md-body a { color: var(--mag); text-decoration: none; }
    .md-body a:hover { text-shadow: 0 0 8px var(--mag); }
    .md-body blockquote { border-left: 3px solid var(--mag); padding: 8px 15px; margin: 12px 0; background: rgba(var(--mag-rgb),0.05); color: rgba(var(--cyan-rgb), 0.7); font-style: italic; }
    .md-body code { background: rgba(var(--cyan-rgb),0.08); border: 1px solid rgba(var(--cyan-rgb),0.2); padding: 2px 6px; color: var(--cyan); font-family: 'Share Tech Mono', monospace; font-size: 0.85rem; }
    .md-body pre { background: rgba(var(--cyan-rgb),0.05); border: 1px solid rgba(var(--cyan-rgb),0.2); padding: 12px; margin: 12px 0; overflow-x: auto; border-left: 3px solid rgba(var(--cyan-rgb),0.4); }
    .md-body pre code { border: none; padding: 0; background: transparent; }
    .md-body ul, .md-body ol { margin: 10px 0 10px 20px; color: rgba(var(--cyan-rgb), 0.85); font-size: 0.9rem; }
    .md-body li { margin-bottom: 5px; }
    .md-body hr { border: none; border-top: 1px solid rgba(var(--mag-rgb),0.3); margin: 20px 0; }
    .md-body table { width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 0.85rem; }
    .md-body th { font-family: 'Orbitron', monospace; color: var(--mag); border-bottom: 1px solid rgba(var(--mag-rgb),0.4); padding: 8px 12px; text-align: left; }
    .md-body td { border-bottom: 1px solid rgba(var(--cyan-rgb),0.1); padding: 8px 12px; color: rgba(var(--cyan-rgb), 0.8); }

    #modalFooter { margin-top: 30px; padding-top: 20px; border-top: 1px solid rgba(var(--mag-rgb),0.2); display: flex; flex-wrap: wrap; gap: 10px; }
    .footer-tag { background: transparent; border: 1px solid var(--cyan); color: var(--cyan); padding: 5px 12px; font-size: 0.75rem; cursor: pointer; transition: 0.2s; }
    .footer-tag:hover { background: var(--cyan); color: var(--bg); box-shadow: 0 0 10px var(--cyan); }

    /* Settings Panel */
    #settings-scrim { position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s ease; }
    #settings-scrim.open { opacity:1;pointer-events:auto; }
    #settings-panel {
      position:fixed;top:0;right:0;height:100%;width:min(340px,88vw);
      background:var(--bg2);border-left:1px solid var(--border);z-index:201;
      transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
      display:flex;flex-direction:column;pointer-events:auto;
    }
    #settings-panel.open { transform:translateX(0); }
    .set-head { display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border); }
    .set-head h3 { font-family:'Orbitron',monospace;font-size:13px;letter-spacing:0.08em;color:var(--bright); margin: 0; }
    .set-body { flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:16px; }
    .set-page { display:flex;flex-direction:column;gap:14px; }
    .param-desc { font-size:10.5px;color:var(--dim);line-height:1.6; }
    .theme-toggle-row { display:flex;gap:8px; }
    .theme-toggle-row button {
      flex:1;padding:9px;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;
      background:var(--bg3);border:1px solid var(--border);color:var(--dim);border-radius:6px;cursor:pointer;
    }
    .theme-toggle-row button.active { color:var(--cyan);border-color:var(--cyan); }
    .theme-row { display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--border); }
    .theme-row:last-child { border-bottom:none; }
    .theme-lbl { flex:1;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:0.5px; }
    .theme-swatch {
      -webkit-appearance:none;-moz-appearance:none;appearance:none;
      background-color:transparent;width:34px;height:22px;border:none;padding:0;cursor:pointer;
    }
    .theme-swatch::-webkit-color-swatch-wrapper { padding:0; }
    .theme-swatch::-webkit-color-swatch { border:1px solid var(--border);border-radius:3px; }
    .theme-swatch::-moz-color-swatch { border:1px solid var(--border);border-radius:3px; }
    .theme-reset { font-size:9px;color:var(--dim);background:none;border:1px solid var(--border);cursor:pointer;padding:3px 7px;flex-shrink:0;border-radius:4px; }
    .theme-reset:hover { color:var(--mag);border-color:var(--mag); }
    .reset-all-btn {
      font-size:10px;letter-spacing:0.05em;text-transform:uppercase;color:var(--dim);
      background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:9px;cursor:pointer;
    }
    .reset-all-btn:hover { color:var(--danger);border-color:var(--danger); }
  </style>
</head>
<body>

  <div class="head-row">
    <h1 class="nexus-title">
      <img src="https://ishtarofficial.github.io/ae-lexicon/images/aevoverseanimini.gif" alt="ÆVOVERSE" style="height: 1em; vertical-align: middle; margin-right: 10px;">
      NEXUS
    </h1>
    <div style="display: flex; gap: 8px;">
      <button class="icon-btn" id="settings-btn" title="Settings">&#9881;</button>
    </div>
  </div>

  <input type="text" id="searchBar" placeholder="Search parameters, tags, or concepts...">
  <div id="cloudGrid"></div>

  <!-- Popup Modal -->
  <div id="modalOverlay" onclick="closeModal(event)">
    <div id="modalContent" onclick="event.stopPropagation()">
      <span class="close-btn" onclick="closeModal(event)">X</span>
      <div id="modalImage">Æ</div>
      <h2 id="modalHeader">Title</h2>
      <div id="modalSub">Subtitle / Link</div>
      <div class="md-body" id="modalMarkdown">Loading...</div>
      <div id="modalFooter"></div>
    </div>
  </div>

  <!-- Settings Panel -->
  <div id="settings-scrim"></div>
  <div id="settings-panel">
    <div class="set-head">
      <h3>SETTINGS</h3>
      <button class="icon-btn" id="settings-close">&#10005;</button>
    </div>
    <div class="set-body">
      <div class="set-page">
        <div class="theme-toggle-row">
          <button id="mode-dark">&#9789; Dark</button>
          <button id="mode-light">&#9788; Light</button>
        </div>
        <div class="param-desc">Overrides on top of whichever base mode is active above. Every swatch is a live CSS variable used throughout the board and UI. Reset any single color, or all at once.</div>
        <div id="theme-editor"></div>
        <button class="reset-all-btn" id="resetAllColors">Reset all colors</button>
      </div>
    </div>
  </div>

  <script>
    const THEME_VARS = [
      { key:'cyan', label:'Primary (Cyan)' },
      { key:'mag', label:'Secondary (Magenta)' },
      { key:'purple', label:'Purple accent' },
      { key:'b-accent', label:'Alt accent' },
      { key:'bg', label:'Background' },
      { key:'bg2', label:'Background 2' },
      { key:'bg3', label:'Background 3' },
      { key:'border', label:'Borders' },
      { key:'text', label:'Text' },
      { key:'bright', label:'Bright text' },
      { key:'dim', label:'Dim text' },
      { key:'dead', label:'Dead / disabled' },
      { key:'danger', label:'Danger (hearts / mistakes)' },
      { key:'ok', label:'Success (level cleared)' },
    ];
    const DISP_KEY = 'nexus-disp-state-v1';
    let dispState = { theme: 'dark', customColors: {} };

    function hexFromVar(key){
      const v = getComputedStyle(document.body).getPropertyValue('--'+key).trim();
      if(/^#[0-9a-f]{6}$/i.test(v)) return v;
      const probe = document.createElement('div'); probe.style.color=v; document.body.appendChild(probe);
      const rgb = getComputedStyle(probe).color.match(/\d+/g); document.body.removeChild(probe);
      if(!rgb) return '#888888';
      return '#'+rgb.slice(0,3).map(n=>(+n).toString(16).padStart(2,'0')).join('');
    }
    
    function hexToRgbTriplet(hex){
      const m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex);
      if(!m) return null;
      return parseInt(m[1],16)+','+parseInt(m[2],16)+','+parseInt(m[3],16);
    }
    
    function saveDisp() { localStorage.setItem(DISP_KEY, JSON.stringify(dispState)); }
    
    function loadDisp() {
      try { 
        const d = JSON.parse(localStorage.getItem(DISP_KEY)||'{}'); 
        Object.assign(dispState, d); 
        if(!dispState.customColors) dispState.customColors={}; 
      } catch(e){}
      applyDisp(); renderThemeEditor();
    }
    
    function applyDisp() {
      const r = document.body;
      r.classList.toggle('light', dispState.theme === 'light');
      
      const mdDark = document.getElementById('mode-dark');
      const mdLight = document.getElementById('mode-light');
      if (mdDark) mdDark.classList.toggle('active', dispState.theme === 'dark');
      if (mdLight) mdLight.classList.toggle('active', dispState.theme === 'light');
      
      THEME_VARS.forEach(({key}) => r.style.removeProperty('--'+key));
      r.style.removeProperty('--cyan-rgb'); r.style.removeProperty('--mag-rgb');
      
      Object.entries(dispState.customColors || {}).forEach(([key,val]) => {
        r.style.setProperty('--'+key, val);
        if(key==='cyan'||key==='mag'){ 
          const trip=hexToRgbTriplet(val); 
          if(trip) r.style.setProperty('--'+key+'-rgb', trip); 
        }
      });
    }

    function renderThemeEditor() {
      const box = document.getElementById('theme-editor');
      if (!box) return;
      box.innerHTML = THEME_VARS.map(({key, label}) => {
        const val = dispState.customColors[key] || hexFromVar(key);
        return `<div class="theme-row"><span class="theme-lbl">${label}</span><input type="color" class="theme-swatch" value="${val}" data-key="${key}"/><button class="theme-reset" data-reset="${key}">reset</button></div>`;
      }).join('');
      box.querySelectorAll('input[type=color]').forEach(inp => inp.addEventListener('input', e => {
        dispState.customColors[e.target.dataset.key] = e.target.value;
        saveDisp(); applyDisp();
      }));
      box.querySelectorAll('[data-reset]').forEach(btn => btn.addEventListener('click', e => {
        delete dispState.customColors[e.target.dataset.reset];
        saveDisp(); applyDisp(); renderThemeEditor();
      }));
    }

    document.getElementById('mode-dark')?.addEventListener('click', () => { dispState.theme='dark'; saveDisp(); applyDisp(); renderThemeEditor(); });
    document.getElementById('mode-light')?.addEventListener('click', () => { dispState.theme='light'; saveDisp(); applyDisp(); renderThemeEditor(); });
    document.getElementById('resetAllColors')?.addEventListener('click', () => { dispState.customColors={}; saveDisp(); applyDisp(); renderThemeEditor(); });

    const scrim = document.getElementById('settings-scrim');
    const panel = document.getElementById('settings-panel');
    document.getElementById('settings-btn')?.addEventListener('click', () => { scrim.classList.add('open'); panel.classList.add('open'); });
    document.getElementById('settings-close')?.addEventListener('click', () => { scrim.classList.remove('open'); panel.classList.remove('open'); });
    scrim?.addEventListener('click', () => { scrim.classList.remove('open'); panel.classList.remove('open'); });

    // --- NEXUS LOGIC ---
    let database = [];

    async function init() {
      loadDisp();
      try {
        const response = await fetch('nexus-index.json');
        database = await response.json();
        renderGrid(database);
      } catch (err) {
        console.error("Failed to load nexus-index.json", err);
        document.getElementById('cloudGrid').innerHTML = "<p>Error: Could not load nexus-index.json. Ensure you are running a local server.</p>";
      }
    }

    function renderGrid(data) {
      const grid = document.getElementById('cloudGrid');
      grid.innerHTML = '';
      data.forEach(item => {
        const tagsHtml = item.tags.map(t => `<span class="tag">${t}</span>`).join('');
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<div class="card-title">${item.title}</div><div class="card-tags">${tagsHtml}</div>`;
        card.onclick = () => openModal(item);
        grid.appendChild(card);
      });
    }

    async function openModal(item) {
      document.getElementById('modalHeader').textContent = item.title;
      
      const sub = document.getElementById('modalSub');
      if(item.link) {
        sub.innerHTML = `<a href="${item.link}" target="_blank" style="color:var(--mag); text-decoration:none;">${item.link}</a>`;
      } else {
        sub.textContent = "Classified Entry";
      }

      const imgDiv = document.getElementById('modalImage');
      if (item.image) {
        imgDiv.innerHTML = `<img src="${item.image}" alt="">`;
      } else {
        imgDiv.innerHTML = "Æ";
      }

      const mdDiv = document.getElementById('modalMarkdown');
      mdDiv.innerHTML = "Processing data stream...";
      document.getElementById('modalOverlay').classList.add('open');

      try {
        const fileResponse = await fetch(item.file);
        if (fileResponse.ok) {
          const text = await fileResponse.text();
          mdDiv.innerHTML = marked.parse(text);
        } else {
          mdDiv.innerHTML = "<span style='color:var(--danger);'>Error 404: File not found in directory.</span>";
        }
      } catch (e) {
        mdDiv.innerHTML = "<span style='color:var(--danger);'>System Error: Cannot read file.</span>";
      }

      const footer = document.getElementById('modalFooter');
      footer.innerHTML = item.tags.map(t => `<div class="footer-tag" onclick="filterByTag('${t}')">${t}</div>`).join('');
    }

    function closeModal(e) {
      document.getElementById('modalOverlay').classList.remove('open');
    }

    function filterByTag(tag) {
      closeModal();
      document.getElementById('searchBar').value = tag;
      filterGrid();
    }

    function filterGrid() {
      const query = document.getElementById('searchBar').value.toLowerCase();
      const filtered = database.filter(item => {
        return item.title.toLowerCase().includes(query) || 
               item.tags.some(t => t.toLowerCase().includes(query));
      });
      renderGrid(filtered);
    }

    document.getElementById('searchBar').addEventListener('input', filterGrid);
    
    // Boot up
    init();
  </script>
</body>
</html>
